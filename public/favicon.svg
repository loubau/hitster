<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 64 64">
  <!-- Beamed eighth notes in the wordmark's yellow and hard pink shadow, on the pop table's felt. -->
  <defs>
    <radialGradient id="felt" cx="50%" cy="28%" r="85%">
      <stop offset="0" stop-color="#157553"/>
      <stop offset=".6" stop-color="#0b4a35"/>
      <stop offset="1" stop-color="#03231a"/>
    </radialGradient>
    <g id="notes">
      <ellipse cx="20" cy="46" rx="8.5" ry="6.4" transform="rotate(-22 20 46)"/>
      <ellipse cx="43" cy="41" rx="8.5" ry="6.4" transform="rotate(-22 43 41)"/>
      <rect x="23.6" y="19" width="4.6" height="26"/>
      <rect x="46.64" y="13" width="4.6" height="27"/>
      <polygon points="23.6,15 51.24,9 51.24,17 23.6,23"/>
    </g>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#felt)"/>
  <g transform="rotate(-6 32 32) translate(-1.5 -1.5)">
    <use xlink:href="#notes" transform="translate(3 3)" fill="#ff3d8b"/>
    <use xlink:href="#notes" fill="#ffe14d"/>
  </g>
</svg>
